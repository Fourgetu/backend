name: Verify vendored Node Contract

on:
  push:
    paths:
      - 'NODE_CONTRACT_SOURCE.json'
      - 'libs/node-contract/**'
      - 'scripts/check-node-contract-sync.mjs'
      - 'tests/unit/node-contract.test.ts'
      - '.github/workflows/deploy-lib.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify contract sync
        run: |
          npm run contract:check
          npm run test:unit
