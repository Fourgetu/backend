name: Custom Release - Backend Image

on:
  push:
    tags:
      - 'custom-*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/fourgetu/remnawave-backend
  FRONTEND_URL: https://github.com/Fourgetu/frontend/releases/download/custom-v0.2.16/remnawave-frontend.zip

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clone_test
          POSTGRES_USER: clone_test
          POSTGRES_PASSWORD: clone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clone_test -d clone_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify vendored Node Contract
        run: npm run contract:check

      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Test locked dependencies and Host transactions
        env:
          DATABASE_URL: postgresql://clone_test:clone_test@127.0.0.1:5432/clone_test
          HOST_CLONE_TEST_DATABASE_URL: postgresql://clone_test:clone_test@127.0.0.1:5432/clone_test
          BULK_DELETE_TEST_DATABASE_URL: postgresql://clone_test:clone_test@127.0.0.1:5432/clone_test
        run: |
          npm ci --no-audit --no-fund
          npm run migrate:generate
          npm run test:unit
          npx tsc --noEmit
          npx prisma db push --skip-generate
          npm run test:integration:host-clone
          npm run test:integration:bulk-delete

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-architecture Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            FRONTEND_URL=${{ env.FRONTEND_URL }}
            __RW_METADATA_VERSION=${{ github.ref_name }}
            __RW_METADATA_GIT_BACKEND_COMMIT=${{ github.sha }}
            __RW_METADATA_GIT_FRONTEND_COMMIT=86225d30669d99a340623fbd28c086a71989a377
            __RW_METADATA_GIT_BRANCH=${{ github.ref_name }}
            __RW_METADATA_BUILD_NUMBER=${{ github.run_number }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Create draft pending image smoke checks
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          draft: true
          make_latest: false
          generate_release_notes: false
          body: |
            # Remnawave custom Backend image

            - Image: `${{ env.IMAGE_NAME }}:${{ github.ref_name }}`
            - Frontend asset: `Fourgetu/frontend@custom-v0.2.16` (multi-user GOST route creation)
            - Node remains `custom-v0.2.15`; this release updates the embedded frontend.
            - Platforms: `linux/amd64`, `linux/arm64`
            - Commit: `${{ github.sha }}`
            - Database migrations run automatically at container startup.
