name: Custom Release - Backend Image

on:
  push:
    tags:
      - 'custom-*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/fourgetu/remnawave-backend
  FRONTEND_URL: https://github.com/Fourgetu/frontend/releases/download/${{ github.ref_name }}/remnawave-frontend.zip

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-architecture Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            FRONTEND_URL=${{ env.FRONTEND_URL }}
            __RW_METADATA_VERSION=${{ github.ref_name }}
            __RW_METADATA_GIT_BACKEND_COMMIT=${{ github.sha }}
            __RW_METADATA_GIT_FRONTEND_COMMIT=${{ github.ref_name }}
            __RW_METADATA_GIT_BRANCH=${{ github.ref_name }}
            __RW_METADATA_BUILD_NUMBER=${{ github.run_number }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          generate_release_notes: false
          body: |
            # Remnawave custom Backend image

            - Image: `${{ env.IMAGE_NAME }}:${{ github.ref_name }}`
            - Frontend asset: `Fourgetu/frontend@${{ github.ref_name }}`
            - Platforms: `linux/amd64`, `linux/arm64`
            - Commit: `${{ github.sha }}`
            - Database migrations run automatically at container startup.
